apiVersion: apps/v1
kind: Deployment

metadata:
  name: myapp
  namespace: 12-example

spec:
  replicas: 2

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      serviceAccountName: myapp

      containers:
        - name: myapp
          image: nginx:latest

          ports:
            - containerPort: 80

          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true

          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: myapp-k8s-secret
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: myapp-k8s-secret
                  key: password

            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: myapp-k8s-secret
                  key: host

      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io

            readOnly: true

            volumeAttributes:
              secretProviderClass: myapp-secrets