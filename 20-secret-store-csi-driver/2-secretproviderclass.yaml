apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: myapp-secrets
  namespace: 12-example

spec:
  provider: aws

  parameters:
    objects: |
      - objectName: "myapp/database"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: username

          - path: password
            objectAlias: password

          - path: database
            objectAlias: database

          - path: host
            objectAlias: host

  secretObjects:
    - secretName: myapp-k8s-secret
      type: Opaque

      data:
        - objectName: username
          key: username

        - objectName: password
          key: password

        - objectName: database
          key: database

        - objectName: host
          key: host