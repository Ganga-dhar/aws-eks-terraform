apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simple-app
  namespace: simple-app

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simple-app

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70